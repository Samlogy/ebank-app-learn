# Qualification. Connection settings have no defaults, so a missing one fails at startup.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

ebank:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**

management:
  server:
    port: 8081    # internal only, do not route publicly
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      deployment.environment.name: qua
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: qua
