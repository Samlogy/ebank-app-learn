# Shared settings. Environment-specific values live in application-{dev,qua,prod}.yml.
# No profile is active by default: a packaged jar needs SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: ebank
  threads:
    virtual:
      enabled: true

  # PostgreSQL + Flyway
  datasource:
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway owns the schema
  flyway:
    locations: classpath:db/migration    # scanned recursively, one folder per module

  # Redis cache
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "ebank:cache:"
  data:
    redis:
      timeout: 2s

# API docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  # Metrics are scraped by Prometheus and logs are shipped from stdout to ELK,
  # so OTLP is used for traces only.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  level:
    root: INFO
    com.ebank: INFO
