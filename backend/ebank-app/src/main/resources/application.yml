# Shared settings. Environment-specific values live in application-{dev,qua,prod}.yml.
# No profile is active by default: a packaged jar needs SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: ebank

  # Config and secrets from Vault (KV v2, mount "ebank"), off unless VAULT_ENABLED=true:
  #   ebank/<EBANK_ENV>/backend/config    non-secret settings: DB_URL, REDIS_HOST, KEYCLOAK_ISSUER_URI...
  #   ebank/<EBANK_ENV>/backend/secrets   DB_PASSWORD, REDIS_PASSWORD, ANTHROPIC_API_KEY...
  # Keys keep the environment variable names, so the ${DB_URL}-style placeholders of the profile
  # files resolve from Vault unchanged. Real environment variables still win over Vault.
  # See infra/vault/README.md.
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_ADDR:http://localhost:8200}
      # TOKEN locally (VAULT_TOKEN), KUBERNETES in k3s (the pod's service account token).
      authentication: ${VAULT_AUTHENTICATION:TOKEN}
      token: ${VAULT_TOKEN:}
      kubernetes:
        role: ${VAULT_ROLE:ebank-backend}
        kubernetes-path: ${VAULT_KUBERNETES_PATH:kubernetes}
        # A token projected for the "vault" audience (see the Helm chart), not the API server one.
        service-account-token-file: ${VAULT_KUBERNETES_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}
      # qua and prod refuse to start without their config instead of running half-configured.
      fail-fast: ${VAULT_FAIL_FAST:false}
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        enabled: true
        backend: ebank
        backend-version: 2
        application-name: ${EBANK_ENV:dev}/backend/config
        default-context: ${EBANK_ENV:dev}/backend/secrets
        # No per-profile paths: the environment is already in the path.
        profiles: ""
      # Dynamic PostgreSQL credentials, off unless VAULT_DATABASE_ENABLED=true: a database user of
      # its own from database/creds/<role>, renewed while the backend runs and replaced before it
      # expires (com.ebank.config.VaultDatabaseCredentials). They arrive as VAULT_DB_USERNAME and
      # VAULT_DB_PASSWORD, which the profiles read before DB_USERNAME and DB_PASSWORD: a static user
      # left in backend/secrets is then ignored. See infra/vault/README.md.
      database:
        enabled: ${VAULT_DATABASE_ENABLED:false}
        role: ${VAULT_DATABASE_ROLE:ebank-${EBANK_ENV:dev}-backend}
        backend: ${VAULT_DATABASE_MOUNT:database}
        username-property: VAULT_DB_USERNAME
        password-property: VAULT_DB_PASSWORD
      config:
        lifecycle:
          # Revokes its leases on shutdown through sys/leases/revoke-prefix/<lease>, which the
          # backend policy allows for its own role only.
          lease-endpoints: LeasesRevokedByPrefix
  threads:
    virtual:
      enabled: true
  # Streamed responses (the ledger CSV export) may take longer than the container's 30 s default.
  mvc:
    async:
      request-timeout: 5m

  # Keycloak access tokens. Issuer and key URLs are set per profile.
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ebank-api

  # PostgreSQL + Flyway
  datasource:
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway owns the schema
  flyway:
    locations: classpath:db/migration    # scanned recursively, one folder per module

  # Redis cache
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "ebank:cache:"
  data:
    redis:
      timeout: 2s

  # Analytics store. Analytics indices are separate from log indices.
  elasticsearch:
    connection-timeout: 2s
    socket-timeout: 5s

  # Outbox over RabbitMQ, only with ebank.outbox.rabbitmq.enabled=true (EBANK_OUTBOX_RABBITMQ_ENABLED).
  # Without it nothing connects to a broker. Credentials come from Vault (backend/secrets).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    # An event is PUBLISHED once the broker confirms it is stored (RabbitOutboxPublisher).
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 10
        # A handler that keeps failing: 5 attempts with back-off, then the dead-letter queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 30s

  # Fallback emails for offline users. The host is set per profile: no host, no email channel.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Everything else under /api needs a token and all other paths are denied.
# prometheus stays open because scrapers have no user token: keep port 8081 internal in qua and prod.
ebank:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
  # Transactional outbox. Delivered in-process by default; through RabbitMQ (one queue per handler,
  # dead-letter queues) with rabbitmq.enabled. See README "Outbox transports".
  outbox:
    relay-enabled: true
    rabbitmq:
      enabled: false
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 10
    max-backoff: 15m
    retention: 7d
    lease: 5m
  chatbot:
    assistant:
      # Without a key the scripted assistant answers (dev and tests). The key never goes in the repository.
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5-5
      effort: low           # short chat answers; raise only if measured quality needs it
      timeout: 60s
      max-tool-turns: 6
      history-size: 30
    limits:
      messages-per-minute: 20
      conversations-per-hour: 10
      handoffs-per-hour: 5
    rate-limit:
      store: redis
  analytics:
    enabled: true
    index: ebank-transactions    # alias over ebank-transactions-v1
  notifications:
    email:
      from: "EBANK <noreply@ebank.local>"
    keycloak:
      realm: ebank
      client-id: ebank-notifications

# API docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  # The broker only counts in health when the outbox uses it.
  health:
    rabbit:
      enabled: ${ebank.outbox.rabbitmq.enabled}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Exact buckets for the latency SLO (infra/observability/prometheus/rules/ebank-slo.yml).
      slo:
        http.server.requests: 500ms, 1s
  observations:
    key-values:
      application: ${spring.application.name}
  # Metrics are scraped by Prometheus and logs are shipped from stdout to ELK,
  # so OTLP is used for traces only.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  level:
    root: INFO
    com.ebank: INFO
