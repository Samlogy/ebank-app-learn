# Shared settings. Environment-specific values live in application-{dev,qua,prod}.yml.
# No profile is active by default: a packaged jar needs SPRING_PROFILES_ACTIVE.
spring:
  application:
    name: ebank
  threads:
    virtual:
      enabled: true

  # Keycloak access tokens. Issuer and key URLs are set per profile.
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ebank-api

  # PostgreSQL + Flyway
  datasource:
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway owns the schema
  flyway:
    locations: classpath:db/migration    # scanned recursively, one folder per module

  # Redis cache
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "ebank:cache:"
  data:
    redis:
      timeout: 2s

  # Fallback emails for offline users. The host is set per profile: no host, no email channel.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Everything else under /api needs a token and all other paths are denied.
# prometheus stays open because scrapers have no user token: keep port 8081 internal in qua and prod.
ebank:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
  # Transactional outbox, delivered in-process until a broker is added.
  outbox:
    relay-enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 10
    max-backoff: 15m
    retention: 7d
  notifications:
    email:
      from: "EBANK <noreply@ebank.local>"
    keycloak:
      realm: ebank
      client-id: ebank-notifications

# API docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  # Metrics are scraped by Prometheus and logs are shipped from stdout to ELK,
  # so OTLP is used for traces only.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  level:
    root: INFO
    com.ebank: INFO
