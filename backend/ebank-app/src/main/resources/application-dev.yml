# Local development. These credentials only work against local containers.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ebank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ebank/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebank}
    username: ${DB_USERNAME:ebank}
    password: ${DB_PASSWORD:ebank}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

ebank:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    public-paths:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,flyway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OTLP_TRACES_ENABLED:false}    # off until a collector runs locally
  opentelemetry:
    resource-attributes:
      deployment.environment.name: dev
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.ebank: DEBUG
