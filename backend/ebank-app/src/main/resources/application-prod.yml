# Production. Connection settings have no defaults, so a missing one fails at startup.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081    # internal only, do not route publicly
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    resource-attributes:
      deployment.environment.name: prod
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
