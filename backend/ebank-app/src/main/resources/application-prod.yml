# Production. Connection settings have no defaults, so a missing one fails at startup.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ebank:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  notifications:
    email:
      from: ${MAIL_FROM}
    keycloak:
      server-url: ${KEYCLOAK_URL}
      client-secret: ${KEYCLOAK_NOTIFICATIONS_CLIENT_SECRET}

management:
  server:
    port: 8081    # internal only, do not route publicly
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    resource-attributes:
      deployment.environment.name: prod
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
