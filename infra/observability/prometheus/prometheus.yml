# Local Prometheus. In k3s, kube-prometheus-stack finds the same targets through ServiceMonitors
# (infra/helm/ebank monitoring.*, infra/vault/k3s/vault-values.yaml) and loads the same rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml

# Firing alerts go to Alertmanager, which groups, inhibits and sends them (to Mailpit locally).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The backend in docker compose (--profile app)...
  - job_name: ebank-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels: { service: ebank-backend, runs_in: compose }
  # ...or started on the host with ./mvnw spring-boot:run. One of the two is down at any time.
  - job_name: ebank-backend-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: ebank-backend, runs_in: host }

  # Vault's own metrics: sealed state, audit failures, leases (rules/vault-alerts.yml).
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["vault:8202"]
        labels: { service: vault }

  # RabbitMQ, with --profile broker (rabbitmq_prometheus).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: { service: rabbitmq }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
