# Alerts on symptoms users or operators would notice. Metric names follow Micrometer's
# Prometheus naming: dots become underscores, timers get _seconds, counters _total.
# Every alert links to its runbook in docs/runbooks/: what it means, how to check, how to fix.
# Error rate and latency are alerted on their error budget: see ebank-slo.yml.
groups:
  - name: ebank-availability
    rules:
      - alert: EbankBackendDown
        # Two scrape jobs exist (compose and host): only alert when neither answers.
        expr: max(up{service="ebank-backend"}) == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-backend-down.md
          summary: The EBANK backend is not answering Prometheus scrapes
          description: No ebank-backend target has been up for 2 minutes.

      - alert: EbankHeapAlmostFull
        expr: |
          sum by (instance) (jvm_memory_used_bytes{service="ebank-backend", area="heap"})
            / sum by (instance) (jvm_memory_max_bytes{service="ebank-backend", area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-heap-almost-full.md
          summary: JVM heap above 90% on {{ $labels.instance }}

  - name: ebank-security
    rules:
      - alert: EbankAuthRejectionSpike
        # Many 401/403 in a short time: a misconfigured client, an expired realm key, or someone probing.
        expr: sum by (status) (rate(ebank_security_rejections_total[5m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-auth-rejection-spike.md
          summary: Unusually many {{ $labels.status }} responses
          description: "{{ $value | humanize }} rejections per second over 5 minutes."

  - name: ebank-events
    rules:
      - alert: EbankOutboxBacklog
        expr: ebank_outbox_events{status="PENDING"} > 100 or ebank_outbox_oldest_pending_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-outbox-backlog.md
          summary: Domain events are not being delivered
          description: Notifications and analytics are falling behind. Check the outbox relay and the handlers' dependencies (SMTP, Keycloak, Elasticsearch).

      - alert: EbankOutboxEventsFailed
        expr: ebank_outbox_events{status="FAILED"} > 0
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-outbox-events-failed.md
          summary: "{{ $value }} outbox event(s) gave up after too many attempts"
          description: "Find them with SELECT * FROM outbox_event WHERE status = 'FAILED', fix the cause, then set them back to PENDING."

      - alert: EbankOutboxDeadLetters
        # RabbitMQ transport only: a handler gave up on messages after its retries.
        expr: max by (handler) (ebank_outbox_dead_letters) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-outbox-dead-letters.md
          summary: "{{ $value }} message(s) in the dead-letter queue of {{ $labels.handler }}"
          description: That handler did not process these events. Fix the cause, then move them back to its queue.

      - alert: EbankNotificationDeliveryFailing
        expr: sum(increase(ebank_notifications_delivered_total{outcome="failed"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-notification-delivery-failing.md
          summary: Notifications fail to be delivered (live push, email or SMS)

  - name: ebank-chat
    rules:
      - alert: EbankAssistantUnavailable
        expr: sum(increase(ebank_chatbot_assistant_replies_total{outcome=~"unavailable|failed"}[10m])) > 3
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-assistant-unavailable.md
          summary: The chat assistant cannot answer (LLM errors or timeouts)
          description: Customers get the fallback message. Check the Anthropic API key, quota and status.

      - alert: EbankAdvisorQueueSlow
        expr: |
          rate(ebank_chatbot_queue_wait_seconds_sum[30m]) / rate(ebank_chatbot_queue_wait_seconds_count[30m]) > 600
        for: 15m
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-advisor-queue-slow.md
          summary: Customers wait more than 10 minutes on average for an advisor

  - name: ebank-database-credentials
    rules:
      - alert: EbankDbCredentialsExpiring
        # Dynamic credentials only (VAULT_DATABASE_ENABLED). A new user replaces the old one a few
        # seconds before it expires; staying under a minute means the replacement does not come.
        expr: ebank_vault_database_credentials_expiry_seconds < 60
        for: 3m
        labels: { severity: critical }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-db-credentials.md
          summary: The backend's database user expires within a minute, or has expired
          description: When it does, every query fails. Vault is probably unreachable or refuses new credentials.

      - alert: EbankDbCredentialsRotationFailing
        expr: increase(ebank_vault_database_credentials_rotations_total{outcome="failure"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          runbook_url: https://github.com/Samlogy/ebank-app-learn/blob/master/docs/runbooks/ebank-db-credentials.md
          summary: Renewing or replacing the backend's database user fails
          description: The current user still works until its lease ends. See the backend logs ("Vault database credentials").
