# Beats in, Elasticsearch out, one index per day. Application logs never carry tokens or message
# content by design; this pipeline also drops a few fields as a second line of defense.
input {
  beats {
    port => 5044
  }
}

filter {
  # Lines that are not JSON (startup banners, JVM warnings) stay as plain messages.
  if [message] =~ /^\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
  mutate {
    remove_field => ["[http][request][headers][authorization]", "[event][original]", "[tags]"]
  }
  if ![service][name] {
    mutate { add_field => { "[service][name]" => "%{[container][name]}" } }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "ebank-logs-%{+YYYY.MM.dd}"
  }
}
