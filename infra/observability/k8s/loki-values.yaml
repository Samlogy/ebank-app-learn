# Loki for the pod logs of k3s, single binary on a volume (chart grafana/loki 7.6.0):
#   helm upgrade --install loki grafana/loki --version 7.6.0 -n monitoring -f infra/observability/k8s/loki-values.yaml
# Docker compose keeps ELK for logs; in the cluster Loki is lighter (it indexes labels, not the
# whole text) and needs no privileged log shipper (see alloy-values.yaml).
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # one tenant; Loki is only reachable inside the cluster
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    retention_period: 14d
    max_line_size: 256KB
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Off: the scalable targets, the memcached caches and the self-tests are for large installs.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }
