# EBANK's RabbitMQ (the outbox transport, see README "Outbox transports"). Used by docker compose and the Helm
# chart. The default user and password come from RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS.
listeners.tcp.default = 5672
# Metrics for Prometheus on :15692 (rabbitmq_prometheus, enabled in enabled_plugins with
# rabbitmq_shovel, which replays dead-letter queues: docs/runbooks/ebank-outbox-dead-letters.md).
prometheus.tcp.port = 15692
# Per-queue metrics, so dead-letter queues can be watched from RabbitMQ's side too.
prometheus.return_per_object_metrics = true
# Quorum queues need at least this much free disk before accepting messages.
disk_free_limit.absolute = 1GB
