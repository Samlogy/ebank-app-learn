# A local SonarQube to try the analysis before Jenkins has one:
#   docker compose -f infra/ci/sonarqube/compose.yml up -d    then http://localhost:9000 (admin / admin)
# SonarQube needs vm.max_map_count >= 262144 on the host (sudo sysctl -w vm.max_map_count=262144).
name: ebank-sonarqube

services:
  sonarqube:
    image: sonarqube:25.10.0.114319-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy

  sonar-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonar-db-data:
