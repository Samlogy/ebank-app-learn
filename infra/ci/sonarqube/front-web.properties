# Front end analysis (the backend uses the Maven plugin: mvn -Pci sonar:sonar).
# Paths are relative to front-web/, like the ones in the lcov report.
sonar.projectKey=ebank-front-web
sonar.projectName=EBANK front end
sonar.projectBaseDir=front-web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/environments/**
sonar.javascript.lcov.reportPaths=coverage/ebank-web/lcov.info
sonar.sourceEncoding=UTF-8
