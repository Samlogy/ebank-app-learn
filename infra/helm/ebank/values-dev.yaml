# Local k3s: plain HTTP on *.ebank.localhost (browsers resolve it to 127.0.0.1), Keycloak in dev
# mode with the versioned realm, Elasticsearch and Mailpit in the cluster. Config and secrets come
# from Vault (ebank/dev/..., written from infra/vault/dev): see infra/vault/README.md.
#   helm upgrade --install ebank infra/helm/ebank -n ebank-dev --create-namespace \
#     -f infra/helm/ebank/values-dev.yaml \
#     --set-file keycloak.realm=infra/keycloak/realms/ebank-realm.json

configSource: vault

hosts:
  app: app.ebank.localhost
  api: api.ebank.localhost
  auth: auth.ebank.localhost

ingress:
  tls:
    enabled: false

backend:
  actuatorPort: http
  config:
    SPRING_PROFILES_ACTIVE: dev
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

keycloak:
  devMode: true

devServices:
  enabled: true

# Paths ebank/dev/..., roles ebank-dev-backend and ebank-dev-eso.
vault:
  env: dev
