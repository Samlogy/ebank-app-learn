# qua: config and secrets come from Vault (ebank/qua/...): see infra/vault/README.md. Then
#   helm upgrade --install ebank infra/helm/ebank -n ebank-qua --create-namespace \
#     -f infra/helm/ebank/values-qua.yaml --set image.tag=<git sha>

configSource: vault

hosts:
  app: app.qua.ebank.example
  api: api.qua.ebank.example
  auth: auth.qua.ebank.example

backend:
  config:
    SPRING_PROFILES_ACTIVE: qua

# Paths ebank/qua/..., roles ebank-qua-backend and ebank-qua-eso.
vault:
  env: qua
