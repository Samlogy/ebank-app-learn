# prod: config and secrets come from Vault (ebank/prod/...): see infra/vault/README.md. Then
#   helm upgrade --install ebank infra/helm/ebank -n ebank-prod --create-namespace \
#     -f infra/helm/ebank/values-prod.yaml --set image.tag=<git sha>

configSource: vault

hosts:
  app: app.ebank.example
  api: api.ebank.example
  auth: auth.ebank.example

ingress:
  tls:
    clusterIssuer: letsencrypt-prod

backend:
  config:
    SPRING_PROFILES_ACTIVE: prod
  resources:
    requests: { cpu: "1", memory: 1536Mi }
    limits: { memory: 2Gi }

postgres:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }

# Paths ebank/prod/..., roles ebank-prod-backend and ebank-prod-eso.
vault:
  env: prod
