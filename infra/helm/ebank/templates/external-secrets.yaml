{{- /*
configSource=vault: External Secrets Operator copies what the third-party images and nginx need from
Vault into Secrets of this namespace. The backend is not here: it reads Vault itself.
*/ -}}
{{- if eq (include "ebank.fromVault" .) "true" }}
{{- $env := .Values.vault.env }}
# Its identity for Vault's Kubernetes auth (role ebank-{{ $env }}-eso, policy ebank-{{ $env }}-eso).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebank-external-secrets
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "external-secrets") | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "external-secrets") | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.address | quote }}
      path: ebank
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.kubernetesAuthPath | quote }}
          role: ebank-{{ $env }}-eso
          serviceAccountRef:
            name: ebank-external-secrets
            # Matches the role's audience in Vault: a token issued for Vault only.
            audiences: [vault]
{{- range $name, $path := dict "ebank-postgres" "postgres" "ebank-redis" "redis" "ebank-keycloak" "keycloak" "ebank-front-web-config" "front-web/config" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "external-secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.vault.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # Never remove the Secret if Vault is briefly unreachable: running pods keep their values.
    deletionPolicy: Retain
  # Every key of ebank/{{ $env }}/{{ $path }} becomes a key of the Secret.
  dataFrom:
    - extract:
        key: {{ $env }}/{{ $path }}
{{- end }}
{{- end }}
