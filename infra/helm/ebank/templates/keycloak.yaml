apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "keycloak") | nindent 4 }}
spec:
  selector:
    {{- include "ebank.selector" "keycloak" | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Keycloak behind the ingress: TLS ends at Traefik, Keycloak trusts its X-Forwarded headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "keycloak") | nindent 4 }}
  {{- with include "ebank.reloader" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ebank.selector" "keycloak" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ebank.labels" (dict "root" $ "name" "keycloak") | nindent 8 }}
      {{- if .Values.secrets.create }}
      annotations:
        checksum/secret: {{ pick .Values.secrets "postgres" "keycloak" | toJson | sha256sum }}
      {{- end }}
    spec:
      {{- include "ebank.podSecurity" (dict "user" 1000) | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          {{- if .Values.keycloak.devMode }}
          args: ["start-dev"{{ if .Values.keycloak.realm }}, "--import-realm"{{ end }}]
          {{- else }}
          args: ["start"{{ if .Values.keycloak.realm }}, "--import-realm"{{ end }}]
          {{- end }}
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ebank-postgres, key: KEYCLOAK_DB_PASSWORD } }
            - name: KC_HOSTNAME
              {{- if eq (include "ebank.fromVault" .) "true" }}
              valueFrom: { secretKeyRef: { name: ebank-keycloak, key: KC_HOSTNAME } }
              {{- else }}
              valueFrom: { configMapKeyRef: { name: ebank-backend-config, key: KEYCLOAK_PUBLIC_URL } }
              {{- end }}
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: ebank-keycloak, key: ADMIN_USERNAME } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ebank-keycloak, key: ADMIN_PASSWORD } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          # Writable root: "start" builds the optimized server into its installation directory.
          {{- include "ebank.containerSecurity" (dict "readOnly" false) | nindent 10 }}
          {{- if .Values.keycloak.realm }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          {{- end }}
      {{- if .Values.keycloak.realm }}
      volumes:
        - name: realm
          secret: { secretName: ebank-realm }
      {{- end }}
