# Runs once, on an empty data volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
data:
  10-keycloak.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d ebank <<SQL
    CREATE USER keycloak WITH PASSWORD '$KEYCLOAK_DB_PASSWORD';
    CREATE DATABASE keycloak OWNER keycloak;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "ebank.selector" "postgres" | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "ebank.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ebank.labels" (dict "root" $ "name" "postgres") | nindent 8 }}
    spec:
      {{- include "ebank.podSecurity" (dict "user" 70 "fsGroup" 70) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: ebank }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ebank-postgres, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ebank-postgres, key: POSTGRES_PASSWORD } }
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ebank-postgres, key: KEYCLOAK_DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/18/data }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ebank"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ebank"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          # Read-only root: writes only to the data volume, /tmp and the socket directory.
          {{- include "ebank.containerSecurity" (dict "readOnly" true) | nindent 10 }}
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.storage }} }
