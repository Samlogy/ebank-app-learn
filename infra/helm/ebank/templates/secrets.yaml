{{- /* dev only: qua and prod create these Secrets outside the chart (see values.yaml). */ -}}
{{- if .Values.secrets.create }}
{{- include "ebank.requireKeys" (dict "root" $ "section" "postgres" "keys" (list "POSTGRES_USER" "POSTGRES_PASSWORD" "KEYCLOAK_DB_PASSWORD")) }}
{{- include "ebank.requireKeys" (dict "root" $ "section" "keycloak" "keys" (list "ADMIN_USERNAME" "ADMIN_PASSWORD")) }}
{{- include "ebank.requireKeys" (dict "root" $ "section" "backend" "keys" (list "DB_USERNAME" "DB_PASSWORD" "REDIS_PASSWORD")) }}
{{- $sections := dict "ebank-postgres" "postgres" "ebank-keycloak" "keycloak" "ebank-backend-secrets" "backend" }}
{{- if .Values.rabbitmq.enabled }}
{{- include "ebank.requireKeys" (dict "root" $ "section" "rabbitmq" "keys" (list "RABBITMQ_DEFAULT_USER" "RABBITMQ_DEFAULT_PASS")) }}
{{- $_ := set $sections "ebank-rabbitmq" "rabbitmq" }}
{{- end }}
{{- range $name, $section := $sections }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" $section) | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := index $.Values.secrets $section }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.keycloak.realm }}
---
# A Secret, not a ConfigMap: the realm export contains a client secret.
apiVersion: v1
kind: Secret
metadata:
  name: ebank-realm
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "keycloak") | nindent 4 }}
type: Opaque
data:
  ebank-realm.json: {{ .Values.keycloak.realm | b64enc | quote }}
{{- end }}
