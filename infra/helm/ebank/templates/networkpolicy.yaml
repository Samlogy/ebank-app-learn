{{- if .Values.networkPolicy.enabled }}
# API traffic only from the ingress controller; actuator only from the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebank.selector" "backend" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
      ports:
        - { port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { port: 8081 }
---
# The databases only accept the app and Keycloak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "data-stores") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, redis] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, keycloak] }
{{- end }}
