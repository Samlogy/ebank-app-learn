{{- if .Values.networkPolicy.enabled }}
# API traffic only from the ingress controller; actuator only from the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebank.selector" "backend" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
      ports:
        - { port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { port: 8081 }
        {{- if eq .Values.backend.actuatorPort "http" }}
        - { port: 8080 }    # dev: actuator has no port of its own
        {{- end }}
---
# The data stores only accept the app and Keycloak (and Vault, for dynamic credentials).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "data-stores") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, redis, rabbitmq] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, keycloak] }
{{- if .Values.rabbitmq.enabled }}
---
# RabbitMQ's metrics, for the monitoring namespace (port 15692 only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-metrics
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "rabbitmq") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebank.selector" "rabbitmq" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { port: 15692 }
{{- end }}
{{- if and (eq (include "ebank.fromVault" .) "true") .Values.vault.database.enabled }}
---
# Vault creates and drops the backend's database users as vault_admin.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-vault
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebank.selector" "postgres" | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.vault.namespace }} }
          podSelector:
            matchLabels: { app.kubernetes.io/name: vault }
      ports:
        - { port: 5432 }
{{- end }}
{{- end }}
