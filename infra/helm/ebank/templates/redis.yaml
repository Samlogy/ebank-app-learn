apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "ebank.selector" "redis" | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# Cache and rate limits. Nothing in Redis has to survive a restart, so there is no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "ebank.labels" (dict "root" $ "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ebank.selector" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ebank.labels" (dict "root" $ "name" "redis") | nindent 8 }}
      {{- if .Values.secrets.create }}
      annotations:
        checksum/secret: {{ .Values.secrets.backend | toJson | sha256sum }}
      {{- end }}
    spec:
      {{- include "ebank.podSecurity" (dict "user" 999) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ebank-backend-secrets, key: REDIS_PASSWORD } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- include "ebank.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
