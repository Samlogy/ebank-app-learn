# Vault in k3s with the official chart (hashicorp/vault 0.34.1):
#   helm upgrade --install vault hashicorp/vault --version 0.34.1 -n vault --create-namespace \
#     -f infra/vault/k3s/vault-values.yaml
# One server with integrated (Raft) storage: right for dev and qua on a single-node k3s. For prod,
# add vault-values-ha.yaml: 3 replicas (server.ha) and transit auto-unseal instead of unseal keys.
#
# Metrics: /v1/sys/metrics?format=prometheus, without a token (the listener's telemetry block),
# scraped by kube-prometheus-stack once serverTelemetry.serviceMonitor.enabled is true.
global:
  # The EBANK pods talk to Vault inside the cluster; TLS ends at the ingress if Vault's UI is exposed.
  tlsDisable: true

injector:
  # Not used: the backend reads Vault itself and External Secrets Operator serves the other pods.
  enabled: false

server:
  image:
    repository: hashicorp/vault
    tag: 2.2.1          # same version as docker compose
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
        # Metrics carry no secret; the endpoint is only reachable inside the cluster.
        telemetry {
          unauthenticated_metrics_access = true
        }
      }
      storage "raft" {
        path = "/vault/data"
      }
      service_registration "kubernetes" {}
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }
  dataStorage:
    enabled: true
    size: 2Gi
  auditStorage:
    enabled: false      # the audit device writes to stdout (see apply.sh): collected with the pod logs
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # The chart's defaults already run Vault as non-root with a read-only root filesystem.
  networkPolicy:
    enabled: false

ui:
  enabled: true

# kube-prometheus-stack (infra/observability/k8s): turn on once it is installed, as the
# ServiceMonitor kind only exists with its CRDs. Every pod is scraped through vault-internal, so
# standbys report their own sealed state; the alerts are in infra/observability/prometheus/rules.
serverTelemetry:
  serviceMonitor:
    enabled: false
    matchLabels:
      vault-internal: "true"
