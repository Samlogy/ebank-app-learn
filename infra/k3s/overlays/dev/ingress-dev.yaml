# Plain HTTP on *.ebank.localhost, which browsers resolve to 127.0.0.1.
- op: replace
  path: /metadata/annotations
  value:
    traefik.ingress.kubernetes.io/router.entrypoints: web
- op: remove
  path: /spec/tls
- op: replace
  path: /spec/rules/0/host
  value: app.ebank.localhost
- op: replace
  path: /spec/rules/1/host
  value: api.ebank.localhost
- op: replace
  path: /spec/rules/2/host
  value: auth.ebank.localhost
