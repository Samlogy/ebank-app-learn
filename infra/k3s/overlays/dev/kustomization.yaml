# Local k3s. Build with the realm file from infra/keycloak (outside this folder):
#   kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k3s/overlays/dev | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ebank-dev

resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/dev-services

# Dev-only values, like the docker compose defaults. Never reuse them in qua or prod.
secretGenerator:
  - name: ebank-postgres
    literals:
      - POSTGRES_USER=ebank
      - POSTGRES_PASSWORD=ebank
      - KEYCLOAK_DB_PASSWORD=keycloak
  - name: ebank-keycloak
    literals:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
  - name: ebank-backend-secrets
    literals:
      - DB_USERNAME=ebank
      - DB_PASSWORD=ebank
      - REDIS_PASSWORD=dev-redis
      - KEYCLOAK_NOTIFICATIONS_CLIENT_SECRET=dev-notifications-secret
      - ANTHROPIC_API_KEY=
  # A Secret, not a ConfigMap: the realm export contains a client secret.
  - name: ebank-realm
    files:
      - ebank-realm.json=../../../keycloak/realms/ebank-realm.json

patches:
  - path: backend-config.yaml
  - path: backend-dev-profile.yaml
  - path: keycloak-dev.yaml
  - path: ingress-dev.yaml
    target: { kind: Ingress, name: ebank }
