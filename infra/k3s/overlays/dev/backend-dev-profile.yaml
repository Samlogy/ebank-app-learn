# The dev profile has no separate management port: actuator is on 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    metadata:
      annotations:
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
