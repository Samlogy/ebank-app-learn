# prod: secrets are created outside git before the first deploy (see README, "Deploying to k3s"):
#   kubectl -n ebank-prod create secret generic ebank-backend-secrets --from-env-file=<file>
#   kubectl -n ebank-prod create secret generic ebank-postgres --from-env-file=<file>
#   kubectl -n ebank-prod create secret generic ebank-keycloak --from-env-file=<file>
# CI sets the image tags: kustomize edit set image ebank-backend=docker.io/ebank/ebank-backend:<git sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ebank-prod

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: backend-config.yaml
  - path: ingress-hosts.yaml
    target: { kind: Ingress, name: ebank }
  - path: ingress-tls.yaml
    target: { kind: Ingress, name: ebank }
  - path: resources.yaml
