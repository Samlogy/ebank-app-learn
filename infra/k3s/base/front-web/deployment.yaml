apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-web
  labels: { app.kubernetes.io/name: front-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: front-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: front-web }
    spec:
      # No Docker-link variables: a Service named "redis" would set REDIS_PORT=tcp://..., which Spring reads.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx in nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: front-web
          image: ebank-front-web
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
