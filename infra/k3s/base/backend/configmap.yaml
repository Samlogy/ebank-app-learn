# Non-secret settings. Hosts are replaced per overlay. Secrets live in the ebank-backend-secrets Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebank-backend-config
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://postgres:5432/ebank
  REDIS_HOST: redis
  REDIS_SSL_ENABLED: "false"          # in-cluster Redis; set true for a managed one
  # Tokens carry the public issuer; keys are fetched inside the cluster.
  KEYCLOAK_ISSUER_URI: https://auth.ebank.example/realms/ebank
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ebank/protocol/openid-connect/certs
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: https://auth.ebank.example
  CORS_ALLOWED_ORIGINS: https://app.ebank.example
  OTLP_TRACES_ENDPOINT: http://otel-collector.monitoring:4318/v1/traces
  ELASTICSEARCH_URIS: https://elasticsearch.example:9200
  MAIL_HOST: smtp.example
  MAIL_PORT: "587"
  MAIL_FROM: "EBANK <noreply@ebank.example>"
