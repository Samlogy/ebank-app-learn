# Everything EBANK needs in one namespace. Overlays set the namespace, hosts, image tags and secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: ebank
    includeSelectors: false

resources:
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/init-configmap.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/networkpolicy.yaml
  - front-web/deployment.yaml
  - front-web/service.yaml
  - ingress.yaml

images:
  - name: ebank-backend
    newName: docker.io/ebank/ebank-backend
    newTag: latest
  - name: ebank-front-web
    newName: docker.io/ebank/ebank-front-web
    newTag: latest
