# Local development only. Ports are bound to localhost and the default credentials are
# for local containers. Override any of them in infra/compose/.env, which git ignores.
#
#   docker compose up -d --wait                  infrastructure only
#   docker compose --profile app up -d --build --wait    infrastructure, backend and frontend
#   docker compose --profile observability up -d --wait  adds Prometheus, Grafana, OTel, Jaeger, Logstash, Filebeat, Kibana
# A unique name: "ebank" and "ebank-app" are used by older stacks on this machine,
# and sharing a project name means sharing their volumes.
name: ebank-modular

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ebank
      POSTGRES_USER: ${DB_USERNAME:-ebank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ebank}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql    # path changed in the PostgreSQL 18 image
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Analytics store (and later the "E" of ELK). Security is off: local only, bound to localhost.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"    # web UI, for reading test emails
      - "127.0.0.1:1025:1025"    # SMTP

  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Browsers use localhost:8180, containers use keycloak:8080. Tokens always carry this issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The image has no curl or wget.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    profiles: [app]
    image: ebank-backend:dev
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ebank
      DB_USERNAME: ${DB_USERNAME:-ebank}
      DB_PASSWORD: ${DB_PASSWORD:-ebank}
      REDIS_HOST: redis
      # Tokens name localhost as their issuer, but this container fetches keys over the compose network.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ebank
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ebank/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080    # Admin API, to read email and phone for offline notifications
      MAIL_HOST: mailpit
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}    # empty: scripted assistant
      # ECS JSON logs for Filebeat, traces to the collector (both used by --profile observability).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      OTLP_TRACES_ENABLED: ${OTLP_TRACES_ENABLED:-false}
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    labels:
      ebank-logs: "true"    # picked up by Filebeat (--profile observability)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  front-web:
    profiles: [app]
    image: ebank-front-web:dev
    build:
      context: ../../front-web
      dockerfile: ../infra/docker/front-web/Dockerfile
      additional_contexts:
        docker-config: ../docker/front-web
    ports:
      - "127.0.0.1:4200:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ---------------------------------------------------------------- observability (local only)

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"    # scrapes a backend started with spring-boot:run
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.29.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 12

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../observability/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP: the backend on the host sends here
    depends_on:
      - jaeger

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:16686:16686"  # UI

  logstash:
    profiles: [observability]
    image: docker.elastic.co/logstash/logstash:9.4.8
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ../observability/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../observability/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    profiles: [observability]
    image: docker.elastic.co/beats/filebeat:9.4.8
    # Reads other containers' logs: needs root and the Docker socket. Local development only.
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ../observability/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

  kibana:
    profiles: [observability]
    image: docker.elastic.co/kibana/kibana:9.4.8
    volumes:
      - ../observability/elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-setup:
    profiles: [observability]
    image: curlimages/curl:8.17.0
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ../observability/elk/kibana/setup.sh:/setup.sh:ro
    depends_on:
      - kibana
    restart: "no"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  elasticsearch-data:
  postgres-data:
  keycloak-db-data:
