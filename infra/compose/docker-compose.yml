# Local development only. Ports are bound to localhost and the default credentials are
# for local containers. Override any of them in infra/compose/.env, which git ignores.
#
#   docker compose up -d --wait                  infrastructure only
#   docker compose --profile app up -d --build --wait    infrastructure, backend and frontend
# A unique name: "ebank" and "ebank-app" are used by older stacks on this machine,
# and sharing a project name means sharing their volumes.
name: ebank-modular

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ebank
      POSTGRES_USER: ${DB_USERNAME:-ebank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ebank}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql    # path changed in the PostgreSQL 18 image
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"    # web UI, for reading test emails
      - "127.0.0.1:1025:1025"    # SMTP

  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Browsers use localhost:8180, containers use keycloak:8080. Tokens always carry this issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The image has no curl or wget.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    profiles: [app]
    image: ebank-backend:dev
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ebank
      DB_USERNAME: ${DB_USERNAME:-ebank}
      DB_PASSWORD: ${DB_PASSWORD:-ebank}
      REDIS_HOST: redis
      # Tokens name localhost as their issuer, but this container fetches keys over the compose network.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ebank
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ebank/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  front-web:
    profiles: [app]
    image: ebank-front-web:dev
    build:
      context: ../../front-web
      dockerfile: ../infra/docker/front-web/Dockerfile
      additional_contexts:
        docker-config: ../docker/front-web
    ports:
      - "127.0.0.1:4200:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
  keycloak-db-data:
