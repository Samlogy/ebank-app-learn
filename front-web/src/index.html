<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EBANK</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181e1b" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Runs before first paint so a saved theme never flashes the device theme.
      try {
        var theme = localStorage.getItem('ebank.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root
      ><div class="boot"><div class="spinner" role="status" aria-label="Loading"></div></div
    ></app-root>
  </body>
</html>
