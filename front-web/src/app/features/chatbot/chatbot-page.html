<div class="chat">
  <header class="chat-header">
    <span class="bot-avatar"
      ><app-icon [name]="chat.state() === 'WITH_ADVISOR' ? 'user' : 'bot'"
    /></span>
    <div class="who">
      <h1>{{ title() }}</h1>
      <p class="muted small" data-testid="chat-status">
        @if (chat.assistantTyping()) {
          Typing…
        } @else {
          {{ status() }}
        }
        @if (!realtime.connected()) {
          · <span class="offline">reconnecting</span>
        }
      </p>
    </div>
    <div class="actions">
      @switch (chat.state()) {
        @case ('BOT') {
          <button class="btn small-btn" type="button" (click)="chat.handoff()">
            Talk to an advisor
          </button>
        }
        @case ('WAITING_ADVISOR') {
          <button class="btn small-btn" type="button" (click)="chat.backToBot()">
            Back to the assistant
          </button>
        }
        @case ('WITH_ADVISOR') {
          <button class="btn small-btn" type="button" (click)="chat.resolve()">
            End conversation
          </button>
        }
        @case ('RESOLVED') {
          <button class="btn small-btn" type="button" (click)="chat.backToBot()">Reopen</button>
          <button class="btn primary small-btn" type="button" (click)="chat.open()">
            New conversation
          </button>
        }
      }
    </div>
  </header>

  <app-chat-transcript
    [messages]="chat.messages()"
    mine="CUSTOMER"
    [readByOther]="chat.readByOther()"
    [typing]="chat.assistantTyping()"
    [canDelete]="true"
    emptyText="Ask about your accounts, your balance or your recent transfers, or ask for an advisor."
    (deleteMessage)="chat.delete($event)"
  />

  <div class="composer">
    @if (chat.error()) {
      <div class="alert" role="alert">{{ chat.error() }}</div>
    }
    <app-chat-composer
      [disabled]="!chat.conversation() || chat.state() === 'RESOLVED' || chat.sending()"
      [placeholder]="chat.state() === 'RESOLVED' ? 'Start a new conversation to write' : 'Message'"
      (send)="chat.send($event)"
    />
  </div>
</div>
